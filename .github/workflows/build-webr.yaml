name: Build webR Package and Deploy to GitHub Pages

on:
  push:
    branches: [webr-support]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-wasm/webr:main
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build source package
        run: |
          cd ..
          R CMD build --no-build-vignettes unmarked
          mv unmarked_*.tar.gz unmarked/
          cd unmarked
          ls -la *.tar.gz
      
      - name: Install dependencies
        run: |
          # Install packages one at a time with verbose output
          Rscript -e '
            options(repos = c(CRAN = "https://repo.r-wasm.org"))
            
            pkgs <- c("lattice", "MASS", "Matrix", "Rcpp", "RcppArmadillo", "RcppEigen", "reformulas", "TMB")
            
            for (pkg in pkgs) {
              cat("\n=== Installing", pkg, "===\n")
              tryCatch({
                install.packages(pkg, verbose = TRUE)
                cat("SUCCESS:", pkg, "\n")
              }, error = function(e) {
                cat("FAILED:", pkg, "-", conditionMessage(e), "\n")
                # Retry once
                cat("Retrying", pkg, "...\n")
                Sys.sleep(5)
                install.packages(pkg, verbose = TRUE)
              })
            }
            
            # Verify installations
            cat("\n=== Installed packages ===\n")
            print(installed.packages()[, c("Package", "Version")])
          '
      
      - name: Check TMB installation
        run: |
          Rscript -e '
            if (!requireNamespace("TMB", quietly = TRUE)) {
              cat("TMB not found, trying alternative installation...\n")
              # Try downloading directly
              options(timeout = 300)
              install.packages("TMB", repos = "https://repo.r-wasm.org", type = "source")
            }
            library(TMB)
            cat("TMB version:", as.character(packageVersion("TMB")), "\n")
          '
      
      - name: Build binary package
        run: |
          R CMD INSTALL --build unmarked_*.tar.gz
          ls -la
      
      - name: Create package repository structure
        run: |
          mkdir -p repo/bin/emscripten/contrib/4.5
          
          # Find and copy the built package
          if [ -f unmarked_*.tgz ]; then
            cp unmarked_*.tgz repo/bin/emscripten/contrib/4.5/
          else
            cp unmarked_*.tar.gz repo/bin/emscripten/contrib/4.5/
          fi
          
          # Get version from DESCRIPTION
          VERSION=$(grep "^Version:" DESCRIPTION | sed 's/Version: //')
          
          # Create PACKAGES file
          cd repo/bin/emscripten/contrib/4.5
          cat > PACKAGES << EOF
          Package: unmarked
          Version: ${VERSION}
          Depends: R (>= 4.0)
          Imports: graphics, lattice, MASS, Matrix, methods, parallel, Rcpp (>= 0.8.0), reformulas, stats, TMB (>= 1.7.18), utils
          LinkingTo: Rcpp, RcppArmadillo, TMB, RcppEigen
          License: GPL (>=3)
          NeedsCompilation: yes
          EOF
          
          cat PACKAGES
          ls -la
          cd ../../../../..
      
      - name: Create test page
        run: |
          cat > repo/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>unmarked for webR</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  #status { padding: 15px; border-radius: 8px; margin: 20px 0; }
                  .loading { background: #fff3cd; border: 1px solid #ffc107; }
                  .success { background: #d4edda; border: 1px solid #28a745; }
                  .error { background: #f8d7da; border: 1px solid #dc3545; }
                  #output { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
                  button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin: 5px; }
                  button:disabled { background: #6c757d; }
                  code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
              </style>
          </head>
          <body>
              <h1>unmarked for webR</h1>
              <p>Test the <code>unmarked</code> R package running in your browser via webR.</p>
              
              <h3>Installation</h3>
              <pre style="background:#f4f4f4;padding:15px;border-radius:8px;">webr::install("unmarked", repos = "https://braaannigan.github.io/unmarked")</pre>
              
              <div id="status" class="loading">Loading webR...</div>
              
              <div>
                  <button id="testBtn" onclick="runTest()" disabled>Run Occupancy Model</button>
                  <button id="tmbBtn" onclick="runTMBTest()" disabled>Test TMB Engine</button>
              </div>
              
              <h3>Output:</h3>
              <pre id="output">Initializing...</pre>

              <script type="module">
                  import { WebR } from 'https://webr.r-wasm.org/latest/webr.mjs';
                  
                  const output = document.getElementById('output');
                  const status = document.getElementById('status');
                  const webR = new WebR();
                  window.webR = webR;
                  
                  function log(msg) {
                      output.textContent += msg + '\n';
                      output.scrollTop = output.scrollHeight;
                  }
                  
                  async function init() {
                      try {
                          await webR.init();
                          log('✓ webR initialized');
                          
                          status.textContent = 'Installing dependencies...';
                          const deps = ['lattice', 'MASS', 'Matrix', 'Rcpp', 'reformulas', 'TMB', 'RcppArmadillo', 'RcppEigen'];
                          for (const pkg of deps) {
                              log(`Installing ${pkg}...`);
                              await webR.installPackages([pkg]);
                          }
                          log('✓ Dependencies installed');
                          
                          status.textContent = 'Installing unmarked...';
                          const repoUrl = window.location.href.replace(/\/index\.html$/, '').replace(/\/$/, '');
                          await webR.installPackages(['unmarked'], { repos: [repoUrl] });
                          log('✓ unmarked installed');
                          
                          await webR.evalR('library(unmarked)');
                          log('✓ library(unmarked) loaded!');
                          
                          status.className = 'success';
                          status.textContent = '✅ Ready! Click a button to run a test.';
                          document.getElementById('testBtn').disabled = false;
                          document.getElementById('tmbBtn').disabled = false;
                          
                      } catch (err) {
                          status.className = 'error';
                          status.textContent = '❌ Error: ' + err.message;
                          log('ERROR: ' + err.message);
                      }
                  }
                  
                  window.runTest = async function() {
                      output.textContent = 'Running occupancy model...\n';
                      try {
                          const result = await webR.evalR(`
                              set.seed(123)
                              y <- matrix(rbinom(300, 1, 0.3), 100, 3)
                              umf <- unmarkedFrameOccu(y = y)
                              fm <- occu(~1 ~1, data = umf)
                              capture.output(print(fm))
                          `);
                          log((await result.toArray()).join('\n'));
                          log('\n✓ Test passed!');
                      } catch (err) { log('ERROR: ' + err.message); }
                  };
                  
                  window.runTMBTest = async function() {
                      output.textContent = 'Running TMB engine test...\n';
                      try {
                          const result = await webR.evalR(`
                              set.seed(123)
                              y <- matrix(rbinom(300, 1, 0.3), 100, 3)
                              umf <- unmarkedFrameOccu(y = y)
                              fm <- occu(~1 ~1, data = umf, engine = "TMB")
                              capture.output(print(fm))
                          `);
                          log((await result.toArray()).join('\n'));
                          log('\n✓ TMB test passed!');
                      } catch (err) { log('ERROR: ' + err.message); }
                  };
                  
                  init();
              </script>
          </body>
          </html>
          HTMLEOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
